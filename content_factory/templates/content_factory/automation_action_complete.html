<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MLAI action complete</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      body { margin: 0; background: #f7f8fa; color: #18181b; }
      main { width: min(520px, calc(100% - 40px)); margin: 64px auto; }
      section { background: #fff; border: 1px solid #e4e4e7; border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 12px 35px rgba(24, 24, 27, .08); }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0; color: #52525b; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Done</h1>
        {% if result.status == "unsubscribed" %}
          <p>Your reminder channel has been paused.</p>
        {% else %}
          <p>Your article-generation request has started.</p>
        {% endif %}
      </section>
    </main>
  </body>
</html>
