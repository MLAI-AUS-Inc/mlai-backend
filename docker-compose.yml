

services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --threads 2 --timeout 300 --max-requests 1000 --max-requests-jitter 50 mlai.wsgi:application"
    environment:
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "80:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-web

  scheduler:
    build: .
    command: sh -c "until python manage.py migrate --check --noinput; do echo 'Waiting for migrations to complete...'; sleep 5; done; while true; do python manage.py run_scheduled_discovery; sleep 60; done"
    environment:
      APP_ENV: ${APP_ENV:-production}
    env_file:
      - .env
    depends_on:
      - db
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-scheduler

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

networks:
  mlai-shared:
    external: true

volumes:
  postgres_data:
