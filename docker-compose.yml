

services:
  web:
    build: .
    command: sh /app/scripts/start-web.sh
    environment:
      APP_ENV: ${APP_ENV:-production}
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-true}
    ports:
      - "80:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/healthz/live', headers={'Connection':'close'}); resp=urllib.request.urlopen(req, timeout=5); body=resp.read(); resp.close(); raise SystemExit(0 if body else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-web

  scheduler:
    build: .
    command: sh -c "until python manage.py migrate --check --noinput; do echo 'Waiting for migrations to complete...'; sleep 5; done; while true; do python manage.py run_scheduled_discovery; sleep 60; done"
    environment:
      APP_ENV: ${APP_ENV:-production}
      JOBS_SCHEDULER_ENABLED: ${JOBS_SCHEDULER_ENABLED:-true}
      JOBS_SCHEDULE_TIMEZONE: ${JOBS_SCHEDULE_TIMEZONE:-Australia/Melbourne}
      JOBS_SCHEDULE_HOUR: ${JOBS_SCHEDULE_HOUR:-7}
      JOBS_SCHEDULE_MINUTE: ${JOBS_SCHEDULE_MINUTE:-0}
      JOBS_SCHEDULER_POST_TO_SLACK: ${JOBS_SCHEDULER_POST_TO_SLACK:-true}
      JOBS_TOP_PICK_LIMIT: ${JOBS_TOP_PICK_LIMIT:-7}
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-true}
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-scheduler

  analytics-sync:
    build: .
    command: >-
      sh -ec '
        until python manage.py migrate --check --noinput; do
          echo "Waiting for migrations to complete...";
          sleep 5;
        done;
        case "$${CONTENT_ANALYTICS_SYNC_POLL_SECONDS}" in
          ""|*[!0-9]*) echo "CONTENT_ANALYTICS_SYNC_POLL_SECONDS must be an integer" >&2; exit 64 ;;
        esac;
        case "$${CONTENT_ANALYTICS_SYNC_BATCH_LIMIT}" in
          ""|*[!0-9]*) echo "CONTENT_ANALYTICS_SYNC_BATCH_LIMIT must be an integer" >&2; exit 64 ;;
        esac;
        while true; do
          if ! python manage.py sync_content_analytics --limit "$${CONTENT_ANALYTICS_SYNC_BATCH_LIMIT}"; then
            echo "Content analytics sync failed; the next bounded poll will retry" >&2;
          fi;
          sleep "$${CONTENT_ANALYTICS_SYNC_POLL_SECONDS}";
        done
      '
    environment:
      APP_ENV: ${APP_ENV:-production}
      CONTENT_ANALYTICS_SYNC_ENABLED: ${CONTENT_ANALYTICS_SYNC_ENABLED:-true}
      CONTENT_ANALYTICS_SYNC_INTERVAL_SECONDS: ${CONTENT_ANALYTICS_SYNC_INTERVAL_SECONDS:-86400}
      CONTENT_ANALYTICS_SYNC_POLL_SECONDS: ${CONTENT_ANALYTICS_SYNC_POLL_SECONDS:-3600}
      CONTENT_ANALYTICS_SYNC_BATCH_LIMIT: ${CONTENT_ANALYTICS_SYNC_BATCH_LIMIT:-10}
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-analytics-sync

  bridge-worker:
    build: .
    command: sh -c "until python manage.py migrate --check --noinput; do echo 'Waiting for migrations to complete...'; sleep 5; done; python manage.py run_community_bridge"
    environment:
      APP_ENV: ${APP_ENV:-production}
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-true}
    env_file:
      - .env
    depends_on:
      - db
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-bridge-worker
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

networks:
  mlai-shared:
    external: true

volumes:
  postgres_data:
