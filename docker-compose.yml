

services:
  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --threads 2 --timeout 300 --max-requests 1000 --max-requests-jitter 50 mlai.wsgi:application"
    environment:
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "80:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  postgres_data:
