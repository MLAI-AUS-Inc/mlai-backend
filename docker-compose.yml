version: '3.8'

services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 mlai.wsgi:application
    volumes:
      - .:/app
    ports:
      - "80:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=medhack
      - POSTGRES_USER=medhack
      - POSTGRES_PASSWORD=medhack_password

volumes:
  postgres_data:
