
# Bound the on-disk log size per container so a noisy service cannot fill the
# droplet's disk. NOTE: this caps size only -- Docker still deletes a
# container's logs when the container is REPLACED, which is what a deploy does.
# Surviving a deploy requires shipping logs off-box; Sentry (see
# core/observability.py) covers the error case, which is the part that matters
# for post-hoc debugging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # Opt-in; keep running when issuance is disabled so uncertain writes drain.
  event-discount-worker:
    profiles: [event-discounts]
    image: mlai-backend-web
    logging: *default-logging
    command: >-
      sh -ec 'python manage.py migrate --check --noinput;
      exec python manage.py run_periodic_command reconcile_event_discounts
      --poll-seconds 30 --health-file /tmp/mlai-event-discounts.ok'
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-production}
      RUN_MIGRATIONS_ON_START: "0"
    depends_on: [db]
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/mlai-event-discounts.ok'; raise SystemExit(0 if os.path.isfile(p) and time.time()-os.path.getmtime(p)<600 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  web:
    build:
      context: .
      target: runtime
    image: mlai-backend-web
    logging: *default-logging
    command: sh /app/scripts/start-web.sh
    environment:
      APP_ENV: ${APP_ENV:-production}
      RUN_MIGRATIONS_ON_START: "0"
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-true}
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/healthz/live', headers={'Connection':'close','X-Forwarded-Proto':'https'}); resp=urllib.request.urlopen(req, timeout=5); body=resp.read(); resp.close(); raise SystemExit(0 if body else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-web

  # Started explicitly by deploy.sh while the current web container serves.
  # It has no shared-network alias, so internal clients keep using web.
  web-candidate:
    profiles: [deploy]
    image: mlai-backend-web
    logging: *default-logging
    command: sh /app/scripts/start-web.sh
    environment:
      APP_ENV: ${APP_ENV:-production}
      RUN_MIGRATIONS_ON_START: "0"
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-true}
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/healthz/live', headers={'Connection':'close','X-Forwarded-Proto':'https'}); resp=urllib.request.urlopen(req, timeout=5); body=resp.read(); resp.close(); raise SystemExit(0 if body else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      default:
      mlai-shared:

  scheduler:
    image: mlai-backend-web
    logging: *default-logging
    command: >-
      sh -ec '
        health_file=/tmp/mlai-scheduled-discovery.ok;
        rm -f "$${health_file}";
        case "$${SCHEDULED_DISCOVERY_POLL_SECONDS}" in
          ""|*[!0-9]*) echo "SCHEDULED_DISCOVERY_POLL_SECONDS must be a positive integer" >&2; exit 64 ;;
        esac;
        test "$${SCHEDULED_DISCOVERY_POLL_SECONDS}" -gt 0 || {
          echo "SCHEDULED_DISCOVERY_POLL_SECONDS must be greater than zero" >&2;
          exit 64;
        };
        case "$${SCHEDULED_DISCOVERY_HEALTH_MAX_AGE_SECONDS}" in
          ""|*[!0-9]*) echo "SCHEDULED_DISCOVERY_HEALTH_MAX_AGE_SECONDS must be a positive integer" >&2; exit 64 ;;
        esac;
        test "$${SCHEDULED_DISCOVERY_HEALTH_MAX_AGE_SECONDS}" -gt "$${SCHEDULED_DISCOVERY_POLL_SECONDS}" || {
          echo "SCHEDULED_DISCOVERY_HEALTH_MAX_AGE_SECONDS must exceed the poll interval" >&2;
          exit 64;
        };
        until python manage.py migrate --check --noinput; do
          echo "Waiting for migrations to complete...";
          sleep 5;
        done;
        exec python manage.py run_periodic_command run_scheduled_discovery \
          --poll-seconds "$${SCHEDULED_DISCOVERY_POLL_SECONDS}" \
          --health-file "$${health_file}"
      '
    environment:
      APP_ENV: ${APP_ENV:-production}
      SCHEDULED_DISCOVERY_POLL_SECONDS: ${SCHEDULED_DISCOVERY_POLL_SECONDS:-60}
      SCHEDULED_DISCOVERY_HEALTH_MAX_AGE_SECONDS: ${SCHEDULED_DISCOVERY_HEALTH_MAX_AGE_SECONDS:-300}
      JOBS_SCHEDULER_ENABLED: ${JOBS_SCHEDULER_ENABLED:-true}
      JOBS_SCHEDULE_TIMEZONE: ${JOBS_SCHEDULE_TIMEZONE:-Australia/Melbourne}
      JOBS_SCHEDULE_HOUR: ${JOBS_SCHEDULE_HOUR:-7}
      JOBS_SCHEDULE_MINUTE: ${JOBS_SCHEDULE_MINUTE:-0}
      JOBS_SCHEDULER_POST_TO_SLACK: ${JOBS_SCHEDULER_POST_TO_SLACK:-true}
      JOBS_TOP_PICK_LIMIT: ${JOBS_TOP_PICK_LIMIT:-3}
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-true}
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/mlai-scheduled-discovery.ok'; limit=float(os.environ['SCHEDULED_DISCOVERY_HEALTH_MAX_AGE_SECONDS']); raise SystemExit(0 if limit > 0 and os.path.isfile(p) and time.time() - os.path.getmtime(p) <= limit else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-scheduler

  jobs-worker:
    build:
      context: .
      target: jobs
    image: mlai-backend-jobs-worker
    logging: *default-logging
    command: sh -c "until python manage.py migrate --check --noinput; do sleep 5; done; exec python manage.py run_jobs_worker"
    environment:
      APP_ENV: ${APP_ENV:-production}
      JOBS_SCHEDULER_ENABLED: ${JOBS_SCHEDULER_ENABLED:-true}
      JOBS_SCHEDULE_TIMEZONE: ${JOBS_SCHEDULE_TIMEZONE:-Australia/Melbourne}
      JOBS_SCHEDULE_HOUR: ${JOBS_SCHEDULE_HOUR:-7}
      JOBS_SCHEDULE_MINUTE: ${JOBS_SCHEDULE_MINUTE:-0}
      JOBS_SCHEDULER_POST_TO_SLACK: ${JOBS_SCHEDULER_POST_TO_SLACK:-true}
      JOBS_TOP_PICK_LIMIT: ${JOBS_TOP_PICK_LIMIT:-3}
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-true}
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-jobs-worker

  analytics-sync:
    image: mlai-backend-web
    logging: *default-logging
    command: >-
      sh -ec '
        until python manage.py migrate --check --noinput; do
          echo "Waiting for migrations to complete...";
          sleep 5;
        done;
        case "$${CONTENT_ANALYTICS_SYNC_POLL_SECONDS}" in
          ""|*[!0-9]*) echo "CONTENT_ANALYTICS_SYNC_POLL_SECONDS must be an integer" >&2; exit 64 ;;
        esac;
        case "$${CONTENT_ANALYTICS_SYNC_BATCH_LIMIT}" in
          ""|*[!0-9]*) echo "CONTENT_ANALYTICS_SYNC_BATCH_LIMIT must be an integer" >&2; exit 64 ;;
        esac;
        while true; do
          if ! python manage.py sync_content_analytics --limit "$${CONTENT_ANALYTICS_SYNC_BATCH_LIMIT}"; then
            echo "Content analytics sync failed; the next bounded poll will retry" >&2;
          fi;
          sleep "$${CONTENT_ANALYTICS_SYNC_POLL_SECONDS}";
        done
      '
    environment:
      APP_ENV: ${APP_ENV:-production}
      CONTENT_ANALYTICS_SYNC_ENABLED: ${CONTENT_ANALYTICS_SYNC_ENABLED:-true}
      CONTENT_ANALYTICS_SYNC_INTERVAL_SECONDS: ${CONTENT_ANALYTICS_SYNC_INTERVAL_SECONDS:-86400}
      CONTENT_ANALYTICS_SYNC_POLL_SECONDS: ${CONTENT_ANALYTICS_SYNC_POLL_SECONDS:-3600}
      CONTENT_ANALYTICS_SYNC_BATCH_LIMIT: ${CONTENT_ANALYTICS_SYNC_BATCH_LIMIT:-10}
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-analytics-sync

  memory-worker:
    image: mlai-backend-web
    logging: *default-logging
    command: >-
      sh -ec '
        until python manage.py migrate --check --noinput; do
          echo "Waiting for migrations to complete...";
          sleep 5;
        done;
        exec python manage.py run_memory_worker
          --poll-seconds "$${ORG_MEMORY_WORKER_POLL_SECONDS}"
          --lease-seconds "$${ORG_MEMORY_WORKER_LEASE_SECONDS}"
      '
    environment:
      APP_ENV: ${APP_ENV:-production}
      ORG_MEMORY_WORKER_POLL_SECONDS: ${ORG_MEMORY_WORKER_POLL_SECONDS:-2}
      ORG_MEMORY_WORKER_LEASE_SECONDS: ${ORG_MEMORY_WORKER_LEASE_SECONDS:-120}
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-memory-worker

  memory-scheduler:
    image: mlai-backend-web
    logging: *default-logging
    command: >-
      sh -ec '
        until python manage.py migrate --check --noinput; do
          echo "Waiting for migrations to complete...";
          sleep 5;
        done;
        exec python manage.py run_periodic_command schedule_memory_work \
          --poll-seconds "$${ORG_MEMORY_SCHEDULER_POLL_SECONDS}" \
          --continue-on-error
      '
    environment:
      APP_ENV: ${APP_ENV:-production}
      ORG_MEMORY_SCHEDULER_POLL_SECONDS: ${ORG_MEMORY_SCHEDULER_POLL_SECONDS:-60}
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-memory-scheduler

  password-email-worker:
    image: mlai-backend-web
    logging: *default-logging
    command: >-
      sh -ec '
        until python manage.py migrate --check --noinput; do
          echo "Waiting for migrations to complete...";
          sleep 5;
        done;
        exec python manage.py run_password_reset_email_worker
          --poll-seconds "$${PASSWORD_RESET_EMAIL_POLL_SECONDS}"
      '
    environment:
      APP_ENV: ${APP_ENV:-production}
      PASSWORD_RESET_EMAIL_POLL_SECONDS: ${PASSWORD_RESET_EMAIL_POLL_SECONDS:-2}
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    stop_grace_period: 30s

  community-email-worker:
    image: mlai-backend-web
    logging: *default-logging
    command: >-
      sh -ec '
        until python manage.py migrate --check --noinput; do
          echo "Waiting for migrations to complete...";
          sleep 5;
        done;
        exec python manage.py run_email_code_worker
          --poll-seconds "$${COMMUNITY_CHAT_EMAIL_POLL_SECONDS}"
          --batch-size "$${COMMUNITY_CHAT_EMAIL_BATCH_SIZE}"
      '
    environment:
      APP_ENV: ${APP_ENV:-production}
      COMMUNITY_CHAT_EMAIL_POLL_SECONDS: ${COMMUNITY_CHAT_EMAIL_POLL_SECONDS:-2}
      COMMUNITY_CHAT_EMAIL_BATCH_SIZE: ${COMMUNITY_CHAT_EMAIL_BATCH_SIZE:-25}
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    stop_grace_period: 30s

  bridge-worker:
    image: mlai-backend-web
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "manage.py", "message_sync_status", "--check", "--local-worker"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 120s
    command: sh -c "until python manage.py migrate --check --noinput; do echo 'Waiting for migrations to complete...'; sleep 5; done; python manage.py run_community_bridge"
    environment:
      APP_ENV: ${APP_ENV:-production}
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-true}
    env_file:
      - .env
    depends_on:
      - db
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-bridge-worker
    restart: unless-stopped

  bridge-reconciler:
    image: mlai-backend-web
    command: >-
      sh -ec '
        until python manage.py migrate --check --noinput; do
          echo "Waiting for migrations to complete...";
          sleep 5;
        done;
        sleep "$${COMMUNITY_BRIDGE_RECONCILE_INITIAL_DELAY_SECONDS}";
        while true; do
          if ! python manage.py reconcile_recent_community_bridge_slack \
            --lookback-seconds "$${COMMUNITY_BRIDGE_RECONCILE_LOOKBACK_SECONDS}" \
            --max-roots-per-channel "$${COMMUNITY_BRIDGE_RECONCILE_MAX_ROOTS}" \
            --maximum-history-messages "$${COMMUNITY_BRIDGE_RECONCILE_MAX_HISTORY_MESSAGES}" \
            --wait-seconds "$${COMMUNITY_BRIDGE_RECONCILE_WAIT_SECONDS}"; then
            echo "Community bridge gap reconciliation failed; the next bounded poll will retry" >&2;
          fi;
          sleep "$${COMMUNITY_BRIDGE_RECONCILE_POLL_SECONDS}";
        done
      '
    environment:
      APP_ENV: ${APP_ENV:-production}
      COMMUNITY_BRIDGE_RECONCILE_INITIAL_DELAY_SECONDS: ${COMMUNITY_BRIDGE_RECONCILE_INITIAL_DELAY_SECONDS:-30}
      COMMUNITY_BRIDGE_RECONCILE_LOOKBACK_SECONDS: ${COMMUNITY_BRIDGE_RECONCILE_LOOKBACK_SECONDS:-86400}
      COMMUNITY_BRIDGE_RECONCILE_MAX_ROOTS: ${COMMUNITY_BRIDGE_RECONCILE_MAX_ROOTS:-100}
      COMMUNITY_BRIDGE_RECONCILE_MAX_HISTORY_MESSAGES: ${COMMUNITY_BRIDGE_RECONCILE_MAX_HISTORY_MESSAGES:-1000}
      COMMUNITY_BRIDGE_RECONCILE_WAIT_SECONDS: ${COMMUNITY_BRIDGE_RECONCILE_WAIT_SECONDS:-60}
      COMMUNITY_BRIDGE_RECONCILE_POLL_SECONDS: ${COMMUNITY_BRIDGE_RECONCILE_POLL_SECONDS:-300}
    env_file:
      - .env
    depends_on:
      - db
      - bridge-worker
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-bridge-reconciler
    restart: unless-stopped
    stop_grace_period: 30s

  bridge-retention:
    image: mlai-backend-web
    logging: *default-logging
    command: >-
      sh -ec '
        until python manage.py migrate --check --noinput; do
          echo "Waiting for migrations to complete...";
          sleep 5;
        done;
        while true; do
          if ! python manage.py purge_community_bridge_payloads; then
            echo "Community bridge payload purge failed; the next bounded poll will retry" >&2;
          fi;
          sleep "$${COMMUNITY_BRIDGE_PURGE_POLL_SECONDS}";
        done
      '
    environment:
      APP_ENV: ${APP_ENV:-production}
      COMMUNITY_BRIDGE_PURGE_POLL_SECONDS: ${COMMUNITY_BRIDGE_PURGE_POLL_SECONDS:-86400}
    env_file:
      - .env
    depends_on:
      - db
    networks:
      default:
      mlai-shared:
        aliases:
          - mlai-backend-bridge-retention
    restart: unless-stopped
    stop_grace_period: 30s

  native-agent-worker:
    profiles: [native-agent]
    image: mlai-backend-web
    logging: *default-logging
    command: >-
      sh -ec '
        until python manage.py migrate --check --noinput; do
          echo "Waiting for migrations to complete...";
          sleep 5;
        done;
        exec python manage.py run_agent_scheduler --native --webhooks --interval 5 --limit 50 --health-file /tmp/native-agent-heartbeat
      '
    environment:
      APP_ENV: ${APP_ENV:-production}
    env_file:
      - .env
    depends_on:
      - db
    networks:
      default:
      mlai-shared:
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/native-agent-heartbeat'; raise SystemExit(0 if os.path.isfile(p) and time.time() - os.path.getmtime(p) <= 300 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 30s

  community-agent-worker:
    profiles: [community-agent]
    image: mlai-backend-web
    logging: *default-logging
    command: >-
      sh -ec '
        until python manage.py migrate --check --noinput; do
          echo "Waiting for migrations to complete...";
          sleep 5;
        done;
        exec python manage.py run_community_agent --health-file /tmp/community-agent-heartbeat
      '
    environment:
      APP_ENV: ${APP_ENV:-production}
    env_file:
      - .env
    depends_on:
      - db
    networks:
      default:
      mlai-shared:
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/community-agent-heartbeat'; raise SystemExit(0 if os.path.isfile(p) and time.time() - os.path.getmtime(p) <= 300 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 30s

  db:
    image: pgvector/pgvector:0.8.2-pg15-bookworm
    logging: *default-logging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  mlai-shared:
    external: true

volumes:
  postgres_data:
