version: '3.8'

services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --timeout 120 mlai.wsgi:application
    volumes:
      - .:/app
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://mlai_user:mlai_password@db:5432/mlai_db
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_USER=mlai_user
      - POSTGRES_PASSWORD=mlai_password
      - POSTGRES_DB=mlai_db

volumes:
  postgres_data:
