name: Deploy to Digital Ocean

on:
  push:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/mlai_backend_ci.sqlite3
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-engine.txt

    - name: Check migrations are committed
      run: python manage.py makemigrations --check --dry-run

    - name: Run Django system checks
      run: python manage.py check

    - name: Validate production URL settings
      env:
        APP_ENV: production
        DEBUG: "False"
        # settings.py fails closed on a missing SECRET_KEY when APP_ENV=production (a committed
        # signing key would make JWTs forgeable + OAuth tokens decryptable). This step only
        # validates URL *settings* — no JWTs are signed and no tokens are encrypted — so the value
        # is irrelevant to the check; supply the real repo secret when present, else a labelled
        # placeholder so the check stays self-contained (doesn't require the secret to be set).
        SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-prod-url-validation-placeholder-not-a-real-secret' }}
        ALLOWED_HOSTS: api.mlai.au,10.126.0.2
        DEFAULT_BACKEND_URL: https://api.mlai.au
        DEFAULT_FRONTEND_URL: https://mlai.au
        MEDHACK_URL: https://mlai.au
        ESAFETY_URL: https://mlai.au
        VIBE_RAISING_URL: https://mlai.au
        FOUNDER_TOOLS_URL: https://mlai.au
        GOOGLE_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/google
        GITHUB_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/github
        STRIPE_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/stripe
        XERO_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/xero
        NOTION_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/notion
        GOOGLE_DRIVE_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/google-drive
        GOOGLE_ANALYTICS_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/google-analytics
        FT_SLACK_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/slack
        CONTENT_FACTORY_URL: http://10.126.0.4:8000
        VALLEY_HARNESS_URL: http://10.126.0.6:8080
        VALLEY_HARNESS_API_KEY: test-valley-key
        CORS_ALLOWED_ORIGINS: https://mlai.au,https://www.mlai.au
        CSRF_TRUSTED_ORIGINS: https://mlai.au,https://www.mlai.au,https://api.mlai.au
      run: python manage.py validate_prod_urls

    - name: Run targeted Django tests
      run: |
        python manage.py test \
          roo.tests_api.TaskViewSetTests \
          tests.test_validate_prod_urls \
          tests.test_content_factory_org_config \
          tests.test_new_endpoints.EndpointTests \
          tests.test_new_endpoints.ContentFactoryCallbackTests \
          tests.test_content_factory_callback_idempotency \
          tests.test_content_factory_reconciliation \
          tests.test_content_factory_status_contract \
          integrations.tests_github_installation_reconciliation \
          integrations.tests_github_app_probe \
          tests.test_teardown_company \
          tests.test_editorial_learning_loop \
          hospital.test_sim_contest \
          --verbosity 2

  deploy:
    runs-on: ubuntu-latest
    needs: checks
    steps:
    - uses: actions/checkout@v6

    - name: Install SSH Key
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.DO_SSH_KEY }}

    - name: Add Known Hosts
      run: ssh-keyscan -H 209.38.85.60 >> ~/.ssh/known_hosts

    - name: Deploy
      run: ./deploy.sh
