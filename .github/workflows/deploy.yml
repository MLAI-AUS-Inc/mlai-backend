    # The workflow-run conclusion covers the two parallel PostgreSQL jobs as
    # well, so recording this inside the existing checks runner avoids paying
    # for a fourth PR job solely to write the attestation.
    - id: tested-tree
      if: ${{ github.event_name == 'pull_request' }}
      name: Resolve tested Git tree
      run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

    - if: ${{ github.event_name == 'pull_request' }}
      name: Write validation metadata
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        TESTED_TREE: ${{ steps.tested-tree.outputs.tree }}
      run: |
        mkdir -p "$RUNNER_TEMP/pr-validation"
        printf 'pull_request=%s\nhead_sha=%s\ntested_tree=%s\nworkflow_run=%s\nrun_attempt=%s\n' \
          "$PULL_REQUEST" "$HEAD_SHA" "$TESTED_TREE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
          > "$RUNNER_TEMP/pr-validation/attestation.txt"

    - if: ${{ github.event_name == 'pull_request' }}
      name: Record exact validated tree
      uses: actions/upload-artifact@v4
      with:
        name: ci-validated-tree-${{ steps.tested-tree.outputs.tree }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pr-validation/attestation.txt
        retention-days: 14

  postgres-search:
    needs: validation-route
    if: ${{ needs.validation-route.outputs.reuse_pr_checks != 'true' }}
