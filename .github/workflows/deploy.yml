  deploy:
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.validation-route.result == 'success' && (needs.validation-route.outputs.reuse_pr_checks == 'true' || (needs.checks.result == 'success' && needs.postgres-search.result == 'success' && needs.migration-tests.result == 'success')) }}
    runs-on: ubuntu-latest
    needs: [validation-route, checks, postgres-search, migration-tests]
    steps:
    - uses: actions/checkout@v6

    - name: Install SSH Key
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.DO_SSH_KEY }}

    - name: Add Known Hosts
      run: ssh-keyscan -H 209.38.85.60 >> ~/.ssh/known_hosts

    - name: Deploy
      env:
        APP_RELEASE: ${{ github.sha }}
        WEBSITE_CONNECTION_WRITE_MODE: ${{ vars.WEBSITE_CONNECTION_WRITE_MODE || 'disabled' }}
        WEBSITE_CONNECTION_CANARY_DOMAINS: ${{ vars.WEBSITE_CONNECTION_CANARY_DOMAINS || '' }}
        APPROVED_MIGRATION_PLAN_SHA256: ${{ vars.APPROVED_MIGRATION_PLAN_SHA256 || '' }}
        CONNECTOR_CREDENTIAL_KEYS: ${{ secrets.CONNECTOR_CREDENTIAL_KEYS }}
        CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID: ${{ secrets.CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID }}
        REDIS_URL: ${{ secrets.REDIS_URL }}
        XERO_OAUTH_SCOPES: ${{ vars.XERO_OAUTH_SCOPES || '' }}
        ROO_SIM_PATIENT_KEY: ${{ secrets.ROO_SIM_PATIENT_KEY }}
        ROO_API_KEY: ${{ secrets.ROO_API_KEY }}
        INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        LINEAR_MEETING_REQUIRED_TEAM_KEYS: ${{ vars.LINEAR_MEETING_REQUIRED_TEAM_KEYS || 'TECH,STU,MLA' }}
        LINEAR_VERIFY_TEAM_ACCESS: "true"
        LINEAR_CHANNEL_ISSUE_BINDINGS_JSON: ${{ vars.LINEAR_CHANNEL_ISSUE_BINDINGS_JSON }}
        LINEAR_CHANNEL_ISSUE_MAX_COMMENTS: ${{ vars.LINEAR_CHANNEL_ISSUE_MAX_COMMENTS || '250' }}
        LINEAR_CHANNEL_ISSUE_WRITES_ENABLED: ${{ vars.LINEAR_CHANNEL_ISSUE_WRITES_ENABLED || 'false' }}
        COMMUNITY_CHAT_EMAIL_CODE_PEPPER: ${{ secrets.COMMUNITY_CHAT_EMAIL_CODE_PEPPER }}
        COMMUNITY_CHAT_EMAIL_CODE_DELIVERY_SECRET: ${{ secrets.COMMUNITY_CHAT_EMAIL_CODE_DELIVERY_SECRET }}
        COMMUNITY_CHAT_ADAPTER_TOKEN: ${{ secrets.COMMUNITY_CHAT_ADAPTER_TOKEN }}
        COMMUNITY_CHAT_ROLE_SERVICE_TOKEN: ${{ secrets.COMMUNITY_CHAT_ROLE_SERVICE_TOKEN || '' }}
        COMMUNITY_CHAT_ADAPTER_URL: ${{ vars.COMMUNITY_CHAT_ADAPTER_URL }}
        COMMUNITY_CHAT_PASSWORD_AUTH_ENABLED: ${{ vars.COMMUNITY_CHAT_PASSWORD_AUTH_ENABLED || 'false' }}
        COMMUNITY_CHAT_STARTUP_UPDATES_ENABLED: ${{ vars.COMMUNITY_CHAT_STARTUP_UPDATES_ENABLED || '' }}
        MLAI_MCP_ENABLED: ${{ vars.MLAI_MCP_ENABLED || 'false' }}
        VALLEY_MCP_UNIFIED_ALIAS_ENABLED: ${{ vars.VALLEY_MCP_UNIFIED_ALIAS_ENABLED || 'false' }}
        MLAI_MCP_COMMUNITY_ENABLED: ${{ vars.MLAI_MCP_COMMUNITY_ENABLED || 'false' }}
        MLAI_MCP_COMMUNITY_RELAY_URL: ${{ vars.MLAI_MCP_COMMUNITY_RELAY_URL || '' }}
        MLAI_MCP_COMMUNITY_SECRET: ${{ secrets.MLAI_MCP_COMMUNITY_SECRET || '' }}
        MLAI_MCP_CLIENT_INSTALL_URLS: ${{ vars.MLAI_MCP_CLIENT_INSTALL_URLS || '' }}
        MLAI_MCP_NATIVE_AGENTS_ENABLED: ${{ vars.MLAI_MCP_NATIVE_AGENTS_ENABLED || 'false' }}
        AGENT_RUNTIME_ENABLED: ${{ vars.AGENT_RUNTIME_ENABLED || 'false' }}
        AGENT_RUNTIME_NATIVE_ENABLED: ${{ vars.AGENT_RUNTIME_NATIVE_ENABLED || 'false' }}
        AGENT_RUNTIME_NATIVE_REPLIES_ENABLED: ${{ vars.AGENT_RUNTIME_NATIVE_REPLIES_ENABLED || 'false' }}
        AGENT_RUNTIME_MCP_EVENTS_ENABLED: ${{ vars.AGENT_RUNTIME_MCP_EVENTS_ENABLED || 'false' }}
        AGENT_RUNTIME_NATIVE_COMMUNITIES: ${{ vars.AGENT_RUNTIME_NATIVE_COMMUNITIES || '' }}
        AGENT_RUNTIME_DOT_SETUP_URL: ${{ vars.AGENT_RUNTIME_DOT_SETUP_URL || '' }}
        AGENT_RUNTIME_NATIVE_PERSONAL_LIMIT: ${{ vars.AGENT_RUNTIME_NATIVE_PERSONAL_LIMIT || '1' }}
        AGENT_RUNTIME_COMMUNITY_ENABLED: ${{ vars.AGENT_RUNTIME_COMMUNITY_ENABLED || 'false' }}
        AGENT_RUNTIME_PERSONAL_CONTEXT_ENABLED: ${{ vars.AGENT_RUNTIME_PERSONAL_CONTEXT_ENABLED || 'false' }}
        AGENT_RUNTIME_NATIVE_ALWAYS_ADMIT: ${{ vars.AGENT_RUNTIME_NATIVE_ALWAYS_ADMIT || 'false' }}
