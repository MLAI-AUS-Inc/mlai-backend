name: Deploy to Digital Ocean

on:
  pull_request:
    # Stacked implementation PRs need the same validation lanes.
    branches: [ main, "codex/articles-*", "codex/slack-*", "fix/admin-brain-deploy-decoupling", "feat/goal-wakeups", "feat/deploy-detection", "feat/first-article-goal" ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

# Main push and manual releases share one concurrency group so they cannot
# mutate the droplet together. PR checks use their commit SHA so an obsolete
# run cannot block validation of a newer patch on the same PR.
concurrency:
  group: mlai-backend-deploy-${{ github.event_name == 'pull_request' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  # Pull requests run the configured regression lanes and record the exact Git tree that
  # passed. A main push reuses that result only when GitHub associates the
  # commit with the same PR and the deployed tree is byte-for-byte identical.
  # Everything else (direct pushes, stale-base merges, missing/expired
  # artifacts, or API errors) fails closed to the regression lanes below.
  validation-route:
    runs-on: ubuntu-latest
    outputs:
      reason: ${{ steps.route.outputs.reason }}
      reuse_pr_checks: ${{ steps.route.outputs.reuse_pr_checks }}
    steps:
    - uses: actions/checkout@v6

    - id: route
      name: Select validation route
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python scripts/ci_reuse_pr_checks.py

  checks:
    needs: validation-route
    if: ${{ needs.validation-route.outputs.reuse_pr_checks != 'true' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/mlai_backend_ci.sqlite3
      CONNECTOR_CREDENTIAL_KEYS: '{"ci-v1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
      CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID: ci-v1
    steps:
    - uses: actions/checkout@v6

    - name: Validate deployment shell syntax
      run: |
        bash -n deploy.sh
        bash -n ops/backend-api/switch-web-upstream.sh

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install Nginx for isolated web handoff test
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends nginx

    - name: Verify release freshness and live web route flip
      run: python -m unittest tests.test_deploy_release_freshness tests.test_backend_web_handoff -v

    - name: Install hash-pinned workflow test dependencies
      run: |
        python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-ci.lock

    - name: Test deployment failure handling and live contract
      run: python -m unittest tests.test_deploy_runtime_checks tests.test_message_sync_deploy_config tests.test_community_bridge_dependency_review_workflow tests.test_valley_mcp_deploy_config tests.test_native_agent_deploy_config tests.test_slack_owner_inventory_deploy_config tests.test_member_room_provisioning_contract -v

    - name: Check jobs delivery contracts without database access
      run: python -m unittest tests.test_jobs_delivery_unit -v

    - name: Install dependencies
      run: |
        python scripts/check_dependency_lock.py
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.lock

    - name: Verify pinned Articles failure and delivery contracts
      env:
        # Dedicated read-only Contents access to the private canonical CF repo.
        # Missing access fails closed; never replace the immutable lock with main.
        CONTENT_FACTORY_CONTRACT_READ_TOKEN: ${{ secrets.CONTENT_FACTORY_CONTRACT_READ_TOKEN }}
      run: |
        python scripts/check_failure_contract.py --remote
        python scripts/check_site_fingerprint_contract.py --remote
        python scripts/check_publishing_inputs_contract.py --remote
        python scripts/check_sealed_verifier_contract.py --remote
        python scripts/check_native_inventory_summary_contract.py --remote
        python -m unittest tests.test_native_inventory_summary_contract -q

    - name: Check test-module assignment
      run: python scripts/check_test_assignment.py

    - name: Test private Studio source preparation without database access
      run: python scripts/test_without_database.py integrations.tests_studio_report_source

    - name: Run isolated refactor checks without database access
      run: python scripts/test_without_database.py content_factory.tests_run_sync_authority_unit content_factory.tests_pulse_sync_unit startup_updates.tests_source_throughput_unit content_factory.tests_current_connection_unit tests.test_refactor_unit tests.test_refactor_django_unit tests.test_refactor_migration_inventory roo.test_event_ticket_price

