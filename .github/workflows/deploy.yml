name: Deploy to Digital Ocean

on:
  push:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/mlai_backend_ci.sqlite3
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check migrations are committed
      run: python manage.py makemigrations --check --dry-run

    - name: Run targeted Django tests
      run: |
        python manage.py test \
          tests.test_content_factory_org_config \
          tests.test_new_endpoints.EndpointTests \
          tests.test_new_endpoints.ContentFactoryCallbackTests \
          --verbosity 2

  deploy:
    runs-on: ubuntu-latest
    needs: checks
    steps:
    - uses: actions/checkout@v4

    - name: Install SSH Key
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.DO_SSH_KEY }}

    - name: Add Known Hosts
      run: ssh-keyscan -H 209.38.85.60 >> ~/.ssh/known_hosts

    - name: Deploy
      run: ./deploy.sh
