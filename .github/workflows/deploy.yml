name: Deploy to Digital Ocean

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.DO_SSH_KEY }}
        known_hosts: |
          |1|um2bvFU9oK5fWlrQab1g5MiuP2w=|2dzMeF+PlByY+j7YAIqfwxccVhU= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFtJFB6f5Sre9BcqBAFtbRQBee4YQqqqiXieFwKAd5Xf
        if_key_exists: replace

    - name: Add Known Hosts
      run: ssh-keyscan -H 209.38.85.60 >> ~/.ssh/known_hosts

    - name: Deploy
      run: ./deploy.sh
