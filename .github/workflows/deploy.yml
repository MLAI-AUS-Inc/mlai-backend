name: Deploy to Digital Ocean

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  bridge-production-recover:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'codex/community-bridge-ops' && github.actor == 'drsamdonegan' }}
    runs-on: ubuntu-latest
    steps:
    - name: Install SSH Key
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.DO_SSH_KEY }}

    - name: Add Known Hosts
      run: ssh-keyscan -H 209.38.85.60 >> ~/.ssh/known_hosts

    - name: Route bridge worker through Chat TLS and replay investigated deliveries
      run: |
        ssh root@209.38.85.60 'bash -s' <<'REMOTE'
        set -euo pipefail
        cd /root/mlai-backend

        adapter_url='https://chat.mlai.au/_mlai/bridge'
        if grep -q '^BUZZ_BRIDGE_ADAPTER_URL=' .env; then
          sed -i "s|^BUZZ_BRIDGE_ADAPTER_URL=.*$|BUZZ_BRIDGE_ADAPTER_URL=${adapter_url}|" .env
        else
          printf 'BUZZ_BRIDGE_ADAPTER_URL=%s\n' "$adapter_url" >> .env
        fi
        chmod 600 .env

        docker compose up -d --no-deps --force-recreate bridge-worker
        docker compose exec -T bridge-worker python -c \
          'import os; assert os.environ["BUZZ_BRIDGE_ADAPTER_URL"] == "https://chat.mlai.au/_mlai/bridge"; print("bridge_worker_tls_route=true")' \
          </dev/null

        docker compose exec -T web python manage.py shell <<'PY'
        import json
        import time

        from django.core.management import call_command

        from integrations.models import (
            CommunityBridgeDelivery,
            CommunityBridgeDeliveryStatus,
            CommunityBridgeMessageLink,
        )


        delivery_ids = [1, 2]
        for delivery in CommunityBridgeDelivery.objects.filter(id__in=delivery_ids).order_by("id"):
            if delivery.status == CommunityBridgeDeliveryStatus.DEAD:
                call_command(
                    "requeue_community_bridge_delivery",
                    delivery.id,
                    confirm=True,
                )

        deadline = time.monotonic() + 90
        while True:
            deliveries = list(
                CommunityBridgeDelivery.objects.filter(id__in=delivery_ids).order_by("id")
            )
            statuses = [delivery.status for delivery in deliveries]
            if len(deliveries) != len(delivery_ids):
                raise SystemExit("Investigated bridge delivery rows are missing")
            if all(status == CommunityBridgeDeliveryStatus.COMPLETED for status in statuses):
                break
            if any(status == CommunityBridgeDeliveryStatus.DEAD for status in statuses):
                break
            if time.monotonic() >= deadline:
                break
            time.sleep(2)

        def error_class(error):
            value = str(error or "")
            for marker in ("HTTP 401", "HTTP 403", "HTTP 404", "HTTP 429"):
                if marker in value:
                    return marker.lower().replace(" ", "_")
            if "ConnectionError" in value:
                return "connection_error"
            if "Timeout" in value:
                return "timeout"
            return value.split(":", 1)[0] if value else ""

        print(json.dumps({
            "deliveries": [
                {
                    "id": delivery.id,
                    "status": delivery.status,
                    "attempts": delivery.attempts,
                    "completed_at": delivery.completed_at,
                    "error_present": bool(delivery.last_error),
                    "error_class": error_class(delivery.last_error),
                    "message_link_count": CommunityBridgeMessageLink.objects.filter(
                        channel=delivery.channel,
                        source_platform=delivery.source_platform,
                        source_channel_id=delivery.source_channel_id,
                        source_message_id=delivery.source_message_id,
                    ).count(),
                }
                for delivery in deliveries
            ],
        }, default=str, sort_keys=True))
        if not all(
            delivery.status == CommunityBridgeDeliveryStatus.COMPLETED
            for delivery in deliveries
        ):
            raise SystemExit("Investigated bridge deliveries did not complete")
        PY
        docker compose ps web bridge-worker
        REMOTE

  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/mlai_backend_ci.sqlite3
      CONNECTOR_CREDENTIAL_KEYS: '{"ci-v1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
      CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID: ci-v1
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-engine.txt

    - name: Check migrations are committed
      run: python manage.py makemigrations --check --dry-run

    - name: Scan tracked source for credentials
      run: python scripts/check_secrets.py

    - name: Run Django system checks
      run: python manage.py check

    - name: Run Django production deployment checks
      env:
        APP_ENV: production
        DEBUG: "False"
        SECRET_KEY: ci-deploy-check-only-placeholder-key-not-used-for-signing
        REDIS_URL: redis://127.0.0.1:6379/0
        HEALTH_HACK_API_KEY: ci-health-hack-worker-key-32-characters-minimum
        ROO_SIM_PATIENT_KEY: ci-roo-sim-patient-key-32-characters-minimum
        ROO_API_KEY: ci-roo-diagnosis-record-key-32-characters-minimum
      run: python manage.py check --deploy --fail-level WARNING

    - name: Validate organisational-memory governance
      env:
        ORG_MEMORY_ENABLED_PROVIDERS: "google_drive"
      run: python manage.py validate_org_memory_governance --environment production

    - name: Run organisational-memory extraction seed evals
      run: python manage.py evaluate_org_memory_extraction

    - name: Run organisational-memory consolidation seed evals
      run: python manage.py evaluate_org_memory_consolidation

    - name: Run organisational-memory retrieval seed evals
      run: python manage.py evaluate_org_memory_retrieval

    - name: Validate production URL settings
      env:
        APP_ENV: production
        DEBUG: "False"
        # settings.py fails closed on a missing SECRET_KEY when APP_ENV=production (a committed
        # signing key would make JWTs forgeable + OAuth tokens decryptable). This step only
        # validates URL *settings* — no JWTs are signed and no tokens are encrypted — so the value
        # is irrelevant to the check; supply the real repo secret when present, else a labelled
        # placeholder so the check stays self-contained (doesn't require the secret to be set).
        SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-prod-url-validation-placeholder-not-a-real-secret' }}
        ALLOWED_HOSTS: api.mlai.au,10.126.0.2
        DEFAULT_BACKEND_URL: https://api.mlai.au
        DEFAULT_FRONTEND_URL: https://mlai.au
        MEDHACK_URL: https://mlai.au
        ESAFETY_URL: https://mlai.au
        VIBE_RAISING_URL: https://mlai.au
        FOUNDER_TOOLS_URL: https://mlai.au
        COMMUNITY_CHAT_API_AUDIENCE: https://api.mlai.au
        COMMUNITY_CHAT_FRONTEND_URL: https://chat.mlai.au
        COMMUNITY_CHAT_RELAY_URL: wss://chat.mlai.au
        COMMUNITY_CHAT_ADAPTER_URL: http://10.126.0.9:3100
        COMMUNITY_CHAT_EMAIL_CODE_AUTH_ENABLED: "true"
        COMMUNITY_CHAT_PASSWORD_AUTH_ENABLED: "false"
        COMMUNITY_CHAT_DEVICE_AUTH_ENABLED: "false"
        CUSTOMERIO_COMMUNITY_CHAT_CODE_MESSAGE_ID: mlai_chat_sign_in_code
        CUSTOMERIO_API_KEY: ci-customerio-api-key-placeholder
        COMMUNITY_CHAT_EMAIL_CODE_PEPPER: ci-chat-code-pepper-independent-value
        COMMUNITY_CHAT_EMAIL_CODE_DELIVERY_SECRET: ci-chat-delivery-independent-value
        COMMUNITY_CHAT_ADAPTER_TOKEN: ci-chat-adapter-independent-value
        COMMUNITY_CHAT_ALLOWED_ORIGINS: https://chat.mlai.au,tauri://localhost,http://tauri.localhost,mlaichat://callback
        GOOGLE_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/google
        GITHUB_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/github
        STRIPE_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/stripe
        XERO_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/xero
        NOTION_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/notion
        GOOGLE_DRIVE_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/google-drive
        GOOGLE_ANALYTICS_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/google-analytics
        FT_SLACK_OAUTH_REDIRECT_URI: https://api.mlai.au/integrations/callback/slack
        CONTENT_FACTORY_URL: http://10.126.0.4:8000
        VALLEY_HARNESS_URL: http://10.126.0.6:8080
        VALLEY_HARNESS_API_KEY: test-valley-key
        REDIS_URL: redis://127.0.0.1:6379/0
        HEALTH_HACK_API_KEY: ci-health-hack-worker-key-32-characters-minimum
        ROO_SIM_PATIENT_KEY: ci-roo-sim-patient-key-32-characters-minimum
        ROO_API_KEY: ci-roo-diagnosis-record-key-32-characters-minimum
        # ops.mlai.au is the only credentialed operations origin. Plane's
        # admin.mlai.au origin must remain untrusted by the MLAI API. MLAI Chat
        # has its own separately required credentialed origin.
        CORS_ALLOWED_ORIGINS: https://mlai.au,https://www.mlai.au,https://victorai.win,https://www.victorai.win,https://ops.mlai.au,https://chat.mlai.au
        CSRF_TRUSTED_ORIGINS: https://mlai.au,https://www.mlai.au,https://api.mlai.au,https://ops.mlai.au,https://chat.mlai.au
      run: python manage.py validate_prod_urls

    - name: Run targeted Django tests
      run: |
        python manage.py test \
          roo.tests_api.TaskViewSetTests \
          core.tests.test_auth_contract \
          core.tests.test_auth_session \
          core.tests.test_ops_domain_transition \
          core.tests.test_request_logging \
          org_memory.tests \
          tests.test_org_memory_governance \
          tests.test_org_memory_production_deploy \
          tests.test_drive_transcript_inventory \
          tests.test_validate_prod_urls \
          tests.test_health_check \
          tests.test_content_factory_org_config \
          tests.test_new_endpoints.EndpointTests \
          tests.test_new_endpoints.ContentFactoryCallbackTests \
          tests.test_content_factory_callback_idempotency \
          tests.test_content_factory_reconciliation \
          tests.test_content_factory_status_contract \
          content_factory.tests_admin_metrics \
          tests.test_community_bridge_adapter_url \
          integrations.tests_community_bridge \
          integrations.tests_community_bridge_contracts \
          core.tests.test_auth_contract \
          tests.test_runtime_hardening \
          integrations.tests_fields \
          integrations.tests_github_installation_reconciliation \
          integrations.tests_github_app_probe \
          integrations.tests_connectors \
          integrations.tests_humanitix \
          integrations.tests_xero_reconciliation \
          integrations.tests_smart_scan \
          integrations.tests_http_client \
          tests.test_teardown_company \
          tests.test_editorial_learning_loop \
          startup_updates.tests_monthly_update_reminders \
          hospital.test_sim_contest \
          hospital.test_sim_guess_proxy \
          hospital.test_sim_patient_proxy \
          hospital.test_sim_security \
          hospital.test_world_view \
          hospital.test_leaderboard_view \
          victor_ai \
          --verbosity 2

  postgres-search:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg15-bookworm
        env:
          POSTGRES_DB: mlai_test
          POSTGRES_USER: mlai
          POSTGRES_PASSWORD: mlai_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlai -d mlai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://mlai:mlai_test_password@127.0.0.1:5432/mlai_test
      CONNECTOR_CREDENTIAL_KEYS: '{"ci-v1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
      CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID: ci-v1
      ORG_MEMORY_EMBEDDING_MODEL: text-embedding-3-small
      ORG_MEMORY_EMBEDDING_VERSION: openai-text-embedding-3-small-v1
      ORG_MEMORY_EMBEDDING_DIMENSIONS: "1536"
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-engine.txt

    - name: Verify PostgreSQL search infrastructure
      run: |
        python manage.py check_org_memory_search --require-vector
        python manage.py migrate --noinput
        python manage.py check_org_memory_search --require-vector --require-installed
        python manage.py test \
          org_memory.tests.test_search_postgres \
          org_memory.tests.test_runtime_postgres \
          org_memory.tests.test_runtime.MemoryRuntimeTests.test_legacy_access_restored_dead_letters_get_version_pinned_replacements \
          org_memory.tests.test_consolidation.MemoryConsolidationTests.test_consolidation_work_payload_is_identifier_only_and_idempotent \
          org_memory.tests.test_activation.StrongGroundingActivationTests.test_existing_new_review_can_be_reconciled_after_reviewed_policy_allows_it \
          org_memory.tests.test_activation.StrongGroundingActivationTests.test_reconciliation_restores_only_legacy_stale_auto_activated_decision \
          org_memory.tests.test_runtime.MemoryRuntimeTests.test_legacy_consolidation_lock_dead_letters_are_requeued_once \
          org_memory.tests.test_runtime.MemoryRuntimeTests.test_stopped_worker_work_is_recovered_and_attempt_is_refunded \
          org_memory.tests.test_extraction.MemoryExtractionTests.test_legacy_dead_letter_reconciliation_schedules_current_target \
          org_memory.tests.test_extraction.MemoryExtractionTests.test_dead_letter_reconciliation_can_target_superseded_extractor_revision \
          org_memory.tests.test_extraction.MemoryExtractionTests.test_superseded_pending_extraction_work_is_cancelled_before_reprocessing \
          org_memory.tests.test_extraction.MemoryExtractionTests.test_superseded_consolidation_work_is_cancelled_by_extraction_target \
          org_memory.tests.test_extraction.MemoryExtractionTests.test_attributed_prompt_injection_discussion_keeps_transcript_extractable \
          org_memory.tests.test_daily_reconciliation.DailyReconciliationTests.test_resolved_dead_letter_does_not_degrade_current_connection_health \
          org_memory.tests.test_pilot_readiness.PilotReadinessTests.test_fresh_completed_daily_report_remains_valid_while_next_report_runs \
          org_memory.tests.test_drive_processing.DriveProcessingTests.test_unchanged_accessible_version_restores_policy_revoked_chunks \
          --verbosity 2

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [checks, postgres-search]
    steps:
    - uses: actions/checkout@v6

    - name: Install SSH Key
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.DO_SSH_KEY }}

    - name: Add Known Hosts
      run: ssh-keyscan -H 209.38.85.60 >> ~/.ssh/known_hosts

    - name: Deploy
      env:
        APP_RELEASE: ${{ github.sha }}
        CONNECTOR_CREDENTIAL_KEYS: ${{ secrets.CONNECTOR_CREDENTIAL_KEYS }}
        CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID: ${{ secrets.CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID }}
        REDIS_URL: ${{ secrets.REDIS_URL }}
        XERO_OAUTH_SCOPES: ${{ vars.XERO_OAUTH_SCOPES || '' }}
        ROO_SIM_PATIENT_KEY: ${{ secrets.ROO_SIM_PATIENT_KEY }}
        VICTOR_AI_ROO_SIGNING_SECRET: ${{ secrets.VICTOR_AI_ROO_SIGNING_SECRET }}
        COMMUNITY_CHAT_EMAIL_CODE_PEPPER: ${{ secrets.COMMUNITY_CHAT_EMAIL_CODE_PEPPER }}
        COMMUNITY_CHAT_EMAIL_CODE_DELIVERY_SECRET: ${{ secrets.COMMUNITY_CHAT_EMAIL_CODE_DELIVERY_SECRET }}
        COMMUNITY_CHAT_ADAPTER_TOKEN: ${{ secrets.COMMUNITY_CHAT_ADAPTER_TOKEN }}
        COMMUNITY_CHAT_ADAPTER_URL: ${{ vars.COMMUNITY_CHAT_ADAPTER_URL }}
        SLACK_BRIDGE_BOT_TOKEN: ${{ secrets.SLACK_BRIDGE_BOT_TOKEN }}
        SLACK_BRIDGE_SIGNING_SECRET: ${{ secrets.SLACK_BRIDGE_SIGNING_SECRET }}
        SLACK_BRIDGE_BOT_USER_ID: ${{ vars.SLACK_BRIDGE_BOT_USER_ID }}
        SLACK_BRIDGE_WORKSPACE_ID: ${{ vars.SLACK_BRIDGE_WORKSPACE_ID }}
        SLACK_BRIDGE_CHANNEL_ID: ${{ vars.SLACK_BRIDGE_CHANNEL_ID }}
        SLACK_BRIDGE_CHANNEL_NAME: ${{ vars.SLACK_BRIDGE_CHANNEL_NAME }}
        BUZZ_BRIDGE_ADAPTER_URL: ${{ vars.BUZZ_BRIDGE_ADAPTER_URL }}
        BUZZ_BRIDGE_ADAPTER_TOKEN: ${{ secrets.BUZZ_BRIDGE_ADAPTER_TOKEN }}
        BUZZ_BRIDGE_CALLBACK_SECRET: ${{ secrets.BUZZ_BRIDGE_CALLBACK_SECRET }}
        BUZZ_BRIDGE_DESTINATION_WORKSPACE_ID: ${{ vars.BUZZ_BRIDGE_DESTINATION_WORKSPACE_ID }}
        BUZZ_BRIDGE_DESTINATION_CHANNEL_ID: ${{ vars.BUZZ_BRIDGE_DESTINATION_CHANNEL_ID }}
        BUZZ_BRIDGE_DESTINATION_CHANNEL_NAME: ${{ vars.BUZZ_BRIDGE_DESTINATION_CHANNEL_NAME }}
        COMMUNITY_BRIDGE_PRODUCTION_ENABLED: ${{ vars.COMMUNITY_BRIDGE_PRODUCTION_ENABLED || 'false' }}
        ORG_MEMORY_PRODUCTION_DEPLOY_ENABLED: ${{ vars.ORG_MEMORY_PRODUCTION_DEPLOY_ENABLED || 'false' }}
        ORG_MEMORY_PRODUCTION_PUBLIC_CHANNEL_ADMIN_SCOPE_APPROVED: ${{ vars.ORG_MEMORY_PRODUCTION_PUBLIC_CHANNEL_ADMIN_SCOPE_APPROVED || 'false' }}
        ORG_MEMORY_PILOT_ALLOWLIST_KEY_VERSION: ${{ secrets.ORG_MEMORY_PILOT_ALLOWLIST_KEY_VERSION }}
        ORG_MEMORY_PILOT_ALLOWLIST_HMAC_KEY: ${{ secrets.ORG_MEMORY_PILOT_ALLOWLIST_HMAC_KEY }}
        ORG_MEMORY_PRODUCTION_APPROVAL_MANIFEST: ${{ secrets.ORG_MEMORY_PRODUCTION_APPROVAL_MANIFEST }}
        ORG_MEMORY_PRODUCTION_STAGE_OPERATOR_EMAIL: ${{ secrets.ORG_MEMORY_PRODUCTION_STAGE_OPERATOR_EMAIL }}
        ORG_MEMORY_PRODUCTION_ACTIVATION_OPERATOR_EMAIL: ${{ secrets.ORG_MEMORY_PRODUCTION_ACTIVATION_OPERATOR_EMAIL }}
      run: |
        if [ -z "$CONNECTOR_CREDENTIAL_KEYS" ]; then
          echo "::error::Required repository secret CONNECTOR_CREDENTIAL_KEYS is not configured"
          exit 1
        fi
        if [ -z "$CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID" ]; then
          echo "::error::Required repository secret CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID is not configured"
          exit 1
        fi
        python - <<'PY'
        import json
        import os

        keys = json.loads(os.environ["CONNECTOR_CREDENTIAL_KEYS"])
        active = os.environ["CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID"]
        if not isinstance(keys, dict) or not keys or active not in keys:
            raise SystemExit("Connector credential keyring secrets are inconsistent")
        PY
        if [ -z "$REDIS_URL" ]; then
          echo "::error::Required repository secret REDIS_URL is not configured"
          exit 1
        fi
        if [ -z "$ROO_SIM_PATIENT_KEY" ]; then
          echo "::error::Required repository secret ROO_SIM_PATIENT_KEY is not configured"
          exit 1
        fi
        if [ "${#VICTOR_AI_ROO_SIGNING_SECRET}" -lt 32 ]; then
          echo "::error::Required repository secret VICTOR_AI_ROO_SIGNING_SECRET is missing or shorter than 32 characters"
          exit 1
        fi
        if [ "$VICTOR_AI_ROO_SIGNING_SECRET" = "$ROO_SIM_PATIENT_KEY" ]; then
          echo "::error::Victor AI and simulated-patient credentials must be distinct"
          exit 1
        fi
        for key in COMMUNITY_CHAT_EMAIL_CODE_PEPPER COMMUNITY_CHAT_EMAIL_CODE_DELIVERY_SECRET COMMUNITY_CHAT_ADAPTER_TOKEN; do
          value="${!key}"
          if [ "${#value}" -lt 32 ]; then
            echo "::error::Required repository secret $key is missing or shorter than 32 characters"
            exit 1
          fi
        done
        if [ "$COMMUNITY_CHAT_EMAIL_CODE_PEPPER" = "$COMMUNITY_CHAT_EMAIL_CODE_DELIVERY_SECRET" ] || [ "$COMMUNITY_CHAT_EMAIL_CODE_PEPPER" = "$COMMUNITY_CHAT_ADAPTER_TOKEN" ] || [ "$COMMUNITY_CHAT_EMAIL_CODE_DELIVERY_SECRET" = "$COMMUNITY_CHAT_ADAPTER_TOKEN" ]; then
          echo "::error::MLAI Chat email and adapter secrets must be independent"
          exit 1
        fi
        if [ -z "$COMMUNITY_CHAT_ADAPTER_URL" ]; then
          echo "::error::Required repository variable COMMUNITY_CHAT_ADAPTER_URL is not configured"
          exit 1
        fi
        case "$COMMUNITY_BRIDGE_PRODUCTION_ENABLED" in
          true|TRUE|True|1|yes|YES|Yes|on|ON|On) COMMUNITY_BRIDGE_PRODUCTION_ENABLED=true ;;
          false|FALSE|False|0|no|NO|No|off|OFF|Off|"") COMMUNITY_BRIDGE_PRODUCTION_ENABLED=false ;;
          *)
            echo "::error::COMMUNITY_BRIDGE_PRODUCTION_ENABLED must be true or false"
            exit 1
            ;;
        esac
        export COMMUNITY_BRIDGE_PRODUCTION_ENABLED
        bridge_present=0
        if [ "$COMMUNITY_BRIDGE_PRODUCTION_ENABLED" = "true" ]; then
          bridge_values=(
            "$SLACK_BRIDGE_BOT_TOKEN"
            "$SLACK_BRIDGE_SIGNING_SECRET"
            "$SLACK_BRIDGE_BOT_USER_ID"
            "$SLACK_BRIDGE_WORKSPACE_ID"
            "$SLACK_BRIDGE_CHANNEL_ID"
            "$SLACK_BRIDGE_CHANNEL_NAME"
            "$BUZZ_BRIDGE_ADAPTER_URL"
            "$BUZZ_BRIDGE_ADAPTER_TOKEN"
            "$BUZZ_BRIDGE_CALLBACK_SECRET"
            "$BUZZ_BRIDGE_DESTINATION_WORKSPACE_ID"
            "$BUZZ_BRIDGE_DESTINATION_CHANNEL_ID"
            "$BUZZ_BRIDGE_DESTINATION_CHANNEL_NAME"
          )
          for value in "${bridge_values[@]}"; do
            [ -n "$value" ] && bridge_present=$((bridge_present + 1))
          done
          if [ "$bridge_present" -ne "${#bridge_values[@]}" ]; then
            echo "::error::Slack and Buzz bridge repository settings must be fully configured when the production bridge is enabled"
            exit 1
          fi
          if [ "${#SLACK_BRIDGE_SIGNING_SECRET}" -lt 32 ] || [ "${#BUZZ_BRIDGE_ADAPTER_TOKEN}" -lt 32 ] || [ "${#BUZZ_BRIDGE_CALLBACK_SECRET}" -lt 32 ]; then
            echo "::error::Slack signing, bridge adapter, and bridge callback secrets must each contain at least 32 characters"
            exit 1
          fi
        else
          echo "Community bridge production activation is disabled; staged bridge settings will not be installed."
        fi
        case "$ORG_MEMORY_PRODUCTION_DEPLOY_ENABLED" in
          true|TRUE|True|1|yes|YES|Yes|on|ON|On) ORG_MEMORY_PRODUCTION_DEPLOY_ENABLED=true ;;
          false|FALSE|False|0|no|NO|No|off|OFF|Off|"") ORG_MEMORY_PRODUCTION_DEPLOY_ENABLED=false ;;
          *)
            echo "::error::ORG_MEMORY_PRODUCTION_DEPLOY_ENABLED must be true or false"
            exit 1
            ;;
        esac
        export ORG_MEMORY_PRODUCTION_DEPLOY_ENABLED
        case "$ORG_MEMORY_PRODUCTION_PUBLIC_CHANNEL_ADMIN_SCOPE_APPROVED" in
          true|TRUE|True|1|yes|YES|Yes|on|ON|On) ORG_MEMORY_PRODUCTION_PUBLIC_CHANNEL_ADMIN_SCOPE_APPROVED=true ;;
          false|FALSE|False|0|no|NO|No|off|OFF|Off|"") ORG_MEMORY_PRODUCTION_PUBLIC_CHANNEL_ADMIN_SCOPE_APPROVED=false ;;
          *)
            echo "::error::ORG_MEMORY_PRODUCTION_PUBLIC_CHANNEL_ADMIN_SCOPE_APPROVED must be true or false"
            exit 1
            ;;
        esac
        export ORG_MEMORY_PRODUCTION_PUBLIC_CHANNEL_ADMIN_SCOPE_APPROVED
        if [ "$ORG_MEMORY_PRODUCTION_DEPLOY_ENABLED" = "true" ]; then
          if ! printf '%s' "$ORG_MEMORY_PILOT_ALLOWLIST_KEY_VERSION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'; then
            echo "::error::ORG_MEMORY_PILOT_ALLOWLIST_KEY_VERSION is missing or invalid"
            exit 1
          fi
          if [ "${#ORG_MEMORY_PILOT_ALLOWLIST_HMAC_KEY}" -lt 32 ]; then
            echo "::error::ORG_MEMORY_PILOT_ALLOWLIST_HMAC_KEY is missing or shorter than 32 characters"
            exit 1
          fi
          if [ -z "$ORG_MEMORY_PRODUCTION_STAGE_OPERATOR_EMAIL" ] || [ -z "$ORG_MEMORY_PRODUCTION_ACTIVATION_OPERATOR_EMAIL" ]; then
            echo "::error::Both Admin Brain production operator email secrets are required"
            exit 1
          fi
          if [ "$ORG_MEMORY_PRODUCTION_STAGE_OPERATOR_EMAIL" = "$ORG_MEMORY_PRODUCTION_ACTIVATION_OPERATOR_EMAIL" ]; then
            echo "::error::Admin Brain production staging and activation operators must be distinct"
            exit 1
          fi
          python - <<'PY'
        import json
        import os

        manifest = json.loads(os.environ["ORG_MEMORY_PRODUCTION_APPROVAL_MANIFEST"])
        if not isinstance(manifest, dict):
            raise SystemExit("ORG_MEMORY_PRODUCTION_APPROVAL_MANIFEST must be a JSON object")
        if manifest.get("organization_domain") != "mlai.au":
            raise SystemExit("Admin Brain production approval must target mlai.au")
        PY
        else
          echo "Admin Brain production activation is disabled; deploying with its query API fail-closed"
        fi
        ./deploy.sh
