# Only this gateway has a host-facing bridge. CMS and database containers stay
# on the internal network. Upstreams are fixed, never derived from request data.
resolver 127.0.0.11 ipv6=off valid=5s;
client_max_body_size 16m;
access_log off;

server {
    listen 8080;
    server_name wordpress.cms-fixture.test;
    if ($host != wordpress.cms-fixture.test) { return 421; }
    location / {
        set $cms_backend wordpress:80;
        proxy_pass http://$cms_backend$request_uri;
        proxy_set_header Host wordpress.cms-fixture.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
server {
    listen 8081;
    server_name ghost.cms-fixture.test;
    if ($host != ghost.cms-fixture.test) { return 421; }
    location / {
        set $cms_backend ghost:2368;
        proxy_pass http://$cms_backend$request_uri;
        proxy_set_header Host ghost.cms-fixture.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
