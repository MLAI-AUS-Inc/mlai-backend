services:
  mysql:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    environment:
      MYSQL_ROOT_PASSWORD: synthetic-ci-database-only
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: synthetic-ci-wordpress-only
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - mysql:/var/lib/mysql
  wordpress:
    image: wordpress:7.1.3-php8.3-apache@sha256:81a34254acaa6ff3b9a67268c2745e9a041c4094cbe5ccd35b75ed3bbdc033b5
    depends_on:
      mysql:
        condition: service_healthy
    environment: &wordpress_environment
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: synthetic-ci-wordpress-only
      WORDPRESS_CONFIG_EXTRA: |
        $$_SERVER['HTTPS'] = 'on';
        define('WP_HOME', 'https://wordpress.cms-fixture.test');
        define('WP_SITEURL', 'https://wordpress.cms-fixture.test');
    volumes: ["wordpress:/var/www/html"]
  wpcli:
    image: wordpress:cli-2.12.0-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    profiles: [tools]
    user: "33:33"
    environment: *wordpress_environment
    volumes: ["wordpress:/var/www/html"]
  ghost:
    image: ghost:6.71.0-alpine@sha256:8e07c5ec63d99e46b135998267eadf6f03e35249199fa29f937f015a350204d5
    environment:
      NODE_ENV: development
      url: https://ghost.cms-fixture.test
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/fixture.db
      privacy__useUpdateCheck: "false"
      privacy__useGravatar: "false"
      privacy__useRpcPing: "false"
      privacy__useStructuredData: "false"
      mail__transport: Direct
    volumes: ["ghost:/var/lib/ghost/content"]
  loopback:
    image: nginx:stable-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    ports: ["127.0.0.1:18880:8080", "127.0.0.1:18881:8081"]
    volumes: ["./loopback.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [default, access]
volumes:
  mysql:
  wordpress:
  ghost:
networks:
  default:
    internal: true
  access: {}
