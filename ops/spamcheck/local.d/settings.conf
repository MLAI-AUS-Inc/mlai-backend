# Content is checked before Resend signs or delivers it. Receiver authentication
# is proved separately from the real seed message, never from synthetic headers.
crm_preflight {
  id = "crm_preflight";
  apply {
    groups_disabled = ["spf", "dkim", "dmarc", "arc", "rbl", "surbl", "reputation"];
    symbols_disabled = ["BAYES_SPAM", "BAYES_HAM", "NEURAL_SPAM", "NEURAL_HAM"];
  }
}
