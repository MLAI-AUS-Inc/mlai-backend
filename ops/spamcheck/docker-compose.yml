name: mlai-spamcheck

services:
  rspamd:
    # Supply a reviewed, immutable rspamd/rspamd tag@sha256 reference.
    image: ${RSPAMD_IMAGE:?Set RSPAMD_IMAGE to a tested rspamd/rspamd tag@sha256 digest}
    volumes:
      - ./local.d:/etc/rspamd/local.d:ro
    tmpfs:
      - /var/lib/rspamd:uid=11333,gid=11333,mode=0750
      - /var/log/rspamd:uid=11333,gid=11333,mode=0750
      - /run/rspamd:uid=11333,gid=11333,mode=0750
      - /tmp
    # No host port, ingress route, UI, SMTP transport or persistent message store.
    expose:
      - "11333"
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The official image ships neither curl nor wget; perl is always there.
      test: ["CMD", "perl", "-MIO::Socket::INET", "-e", "$$s = IO::Socket::INET->new(PeerAddr => q(127.0.0.1:11333), Timeout => 3) or exit 1; print $$s qq(GET /ping HTTP/1.0\r\n\r\n); exit((join q(), <$$s>) =~ /pong/ ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      mlai-shared:
        aliases:
          - rspamd

networks:
  mlai-shared:
    name: ${MLAI_SHARED_NETWORK:-mlai-shared}
    external: true
