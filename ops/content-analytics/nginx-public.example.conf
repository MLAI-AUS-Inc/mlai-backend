# Public analytics ingress. This virtual host intentionally exposes only the
# generated tracker and its collection route. The Umami UI and management API
# belong on a separate VPN/identity-aware private ingress (or an SSH tunnel).
# Keep both paths in lockstep with ops/content-analytics/.env.

server {
    listen 443 ssl http2;
    server_name analytics.example.com;

    ssl_certificate /etc/letsencrypt/live/analytics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /content-signal.js {
        access_log off;
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3000/content-signal.js;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, never append/trust, the header Umami is configured to read.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location = /api/content-signal {
        # Default nginx access logs contain client IPs. Collection traffic is
        # intentionally not written to those logs.
        access_log off;
        limit_except POST OPTIONS { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:3000/api/content-signal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Fail closed. In particular, do not proxy /, /login, /api/auth/*,
    # /api/websites/*, /share/*, or /api/heartbeat on this hostname.
    location / {
        return 404;
    }
}
