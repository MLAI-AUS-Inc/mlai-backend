# Public analytics ingress — Cloudflare-proxied variant (deployed on the
# mlai-backend droplet as /etc/nginx/conf.d/analytics-public.conf).
#
# Differences from nginx-public.example.conf, which assumes direct TLS with a
# CA-issued certificate:
# - analytics.mlai.au DNS is Cloudflare-proxied, so the origin serves a
#   self-signed certificate and the hostname needs a Cloudflare configuration
#   rule setting SSL mode "Full" (the zone default terminates api.mlai.au on
#   plain port 80 and must stay as-is).
# - The end-client address arrives in CF-Connecting-IP. ngx_http_realip_module
#   restores it before the X-Real-IP header Umami is configured to read is set,
#   and only connections from Cloudflare's published ranges are trusted for
#   that restoration, so a direct-to-origin client cannot spoof its address.
#
# /etc/nginx/cloudflare-real-ip.conf is generated on the host from Cloudflare's
# published ranges (refresh occasionally):
#   { curl -fsS https://www.cloudflare.com/ips-v4; echo; \
#     curl -fsS https://www.cloudflare.com/ips-v6; echo; } \
#     | awk 'NF {print "set_real_ip_from " $1 ";"}' \
#     > /etc/nginx/cloudflare-real-ip.conf
#
# Self-signed origin certificate:
#   openssl req -x509 -newkey rsa:2048 -days 3650 -nodes \
#     -subj "/CN=analytics.mlai.au" \
#     -keyout /etc/nginx/ssl/analytics-selfsigned.key \
#     -out /etc/nginx/ssl/analytics-selfsigned.crt
#
# Port 80 stays with the mlai-backend web container; nginx binds 443 only.

include /etc/nginx/cloudflare-real-ip.conf;
real_ip_header CF-Connecting-IP;

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/analytics-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/analytics-selfsigned.key;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name analytics.mlai.au;

    ssl_certificate /etc/nginx/ssl/analytics-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/analytics-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /content-signal.js {
        access_log off;
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3000/content-signal.js;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location = /api/content-signal {
        access_log off;
        limit_except POST OPTIONS { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:3000/api/content-signal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Fail closed. In particular, do not proxy /, /login, /api/auth/*,
    # /api/websites/*, /share/*, or /api/heartbeat on this hostname.
    location / {
        return 404;
    }
}
