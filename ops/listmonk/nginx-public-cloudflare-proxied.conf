# Public listmonk ingress for lists.mlai.au, Cloudflare-proxied. Deploy on the
# mlai-backend droplet as /etc/nginx/conf.d/listmonk-public.conf.
#
# Only listmonk's subscriber-facing routes are reachable here: unsubscribe and
# preference pages, "view in browser", tracked links, the open pixel, static
# assets and template images. The admin UI (/admin), the API (/api, including
# /api/public), the public signup form and the archive are not. Operators reach
# the admin UI over an SSH tunnel to 127.0.0.1:9100.
#
# This file relies on analytics-public.conf on the same host for the
# Cloudflare real-IP include, `real_ip_header CF-Connecting-IP`, and the 443
# default_server that drops unknown hostnames. Don't repeat those here: nginx
# refuses duplicate directives. On a host without that file, copy them in.
#
# Self-signed origin certificate (Cloudflare SSL mode "Full" for lists.mlai.au):
#   openssl req -x509 -newkey rsa:2048 -days 3650 -nodes \
#     -subj "/CN=lists.mlai.au" -addext "subjectAltName=DNS:lists.mlai.au" \
#     -keyout /etc/nginx/ssl/listmonk-selfsigned.key \
#     -out /etc/nginx/ssl/listmonk-selfsigned.crt

upstream mlai_listmonk {
    server 127.0.0.1:9100;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lists.mlai.au;

    ssl_certificate /etc/nginx/ssl/listmonk-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/listmonk-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Every allowed path carries a subscriber UUID, so an access log would tie
    # a recipient to an IP address and user agent. Keep it off.
    access_log off;

    # add_header is only inherited by locations that set none of their own, so
    # every response header lives here at server level.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header X-Powered-By;

    # The open signup form stays closed: MLAI adds people from Luma, imports and
    # Chat, never from a public form. An exact match beats the prefix below.
    location = /subscription/form {
        default_type text/plain;
        return 404 "not available\n";
    }

    # Unsubscribe and preferences, opt-in confirmation, and the subscriber's own
    # data export and wipe.
    location ^~ /subscription/ {
        limit_except GET POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://mlai_listmonk;
    }

    # Tracked link redirects.
    location ^~ /link/ {
        limit_except GET { deny all; }
        proxy_pass http://mlai_listmonk;
    }

    # "View in browser" and the open-tracking pixel.
    location ^~ /campaign/ {
        limit_except GET { deny all; }
        proxy_pass http://mlai_listmonk;
    }

    # Styles and scripts for the subscription pages.
    location ^~ /public/ {
        limit_except GET { deny all; }
        proxy_pass http://mlai_listmonk;
    }

    # Images uploaded for email templates (Settings -> Media, filesystem).
    location ^~ /uploads/ {
        limit_except GET { deny all; }
        proxy_pass http://mlai_listmonk;
    }

    location = /robots.txt {
        limit_except GET { deny all; }
        proxy_pass http://mlai_listmonk;
    }

    # Bounce webhooks from a sending provider. listmonk v6.2 accepts ses,
    # sendgrid, postmark, azure, forwardemail and lettermint; Resend is not
    # supported. Uncomment the provider in use and enable bounce webhooks in
    # Admin -> Settings -> Bounces.
    # location = /webhooks/service/ses {
    #     limit_except POST { deny all; }
    #     client_max_body_size 256k;
    #     proxy_pass http://mlai_listmonk;
    # }

    # Fail closed: /, /admin, /api (including /api/public), /archive, /auth,
    # /webhooks/bounce and anything else. The marker lets smoke-test.sh tell
    # this answer apart from listmonk's own 404 pages.
    location / {
        default_type text/plain;
        return 404 "not available\n";
    }
}
