<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{ .Campaign.Subject }}</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<style>
  body { margin: 0; padding: 0; background: #ffffff; -webkit-text-size-adjust: 100%; }
  .mlai-body, .mlai-body p, .mlai-body li { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 26px; color: #111827; }
  .mlai-body p { margin: 0 0 16px 0; }
  .mlai-body h1, .mlai-body h2, .mlai-body h3 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #111827; line-height: 1.3; margin: 0 0 12px 0; }
  .mlai-body a { color: #0f766e; }
  .mlai-body img { max-width: 100%; height: auto; }
  .mlai-body hr { border: 0; border-top: 1px solid #e5e7eb; margin: 24px 0; }
  .mlai-invite-body p:last-child { margin-bottom: 0; }
  @media only screen and (max-width: 620px) {
    .mlai-shell { padding: 24px 20px !important; }
    .mlai-invite-title { font-size: 24px !important; line-height: 30px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#ffffff">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff">
  <tr>
    <td align="center" class="mlai-shell" style="padding:40px 24px">
      <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px">
        <tr>
          <td class="mlai-body" align="left" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#111827">
            {{ template "content" . }}
          </td>
        </tr>
        <tr>
          <td style="padding:36px 0 0 0">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr><td style="border-top:1px solid #e5e7eb;font-size:0;line-height:0;height:1px">&nbsp;</td></tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 0 0 0">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td valign="middle" align="left">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
                    <td valign="middle" style="padding:0 8px 0 0"><img src="https://api.mlai.au/static/crm/email/mlai-roo.png" width="26" height="26" alt="" style="display:block;width:26px;height:26px;border:0;border-radius:13px;background:#2fd8bf"></td>
                    <td valign="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;line-height:24px;font-weight:700;letter-spacing:-0.3px;color:#9ca3af">MLAI</td>
                  </tr></table>
                </td>
                <td valign="middle" align="right">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="right"><tr>
                    <td style="padding:0 0 0 16px"><a href="https://www.linkedin.com/company/mlai-aus-inc"><img src="https://api.mlai.au/static/crm/email/social-linkedin.png" width="20" height="20" alt="MLAI on LinkedIn" style="display:block;width:20px;height:20px;border:0"></a></td>
                    <td style="padding:0 0 0 16px"><a href="https://www.instagram.com/mlai_aus/"><img src="https://api.mlai.au/static/crm/email/social-instagram.png" width="20" height="20" alt="MLAI on Instagram" style="display:block;width:20px;height:20px;border:0"></a></td>
                  </tr></table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:14px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#9ca3af">
            {{ if .Subscriber.Attribs.consent_reason }}{{ .Subscriber.Attribs.consent_reason }}<br>{{ end }}
            MLAI &middot; Suite 350, 585 Little Collins St, Melbourne VIC 3000 &middot; <a href="mailto:hi@mlai.au" style="color:#9ca3af;text-decoration:underline">hi@mlai.au</a><br>
            <a href="{{ UnsubscribeURL }}" style="color:#9ca3af;text-decoration:underline">Unsubscribe from MLAI emails</a>
          </td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</body>
</html>
