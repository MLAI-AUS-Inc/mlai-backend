{{ define "header" }}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <style>
    .mlai-card h2 {color:#241d33;font-size:24px;line-height:1.3;margin:0 0 16px}
    .mlai-card p {margin:0 0 16px}
    .mlai-card img {max-width:100%;height:auto}
    .mlai-card a {color:#4f3a75}
    @media only screen and (max-width:620px) {.mlai-card {padding:24px 20px!important}}
  </style>
</head>
<body style="margin:0;padding:0;background:#f4f2f7">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f2f7">
    <tr><td align="center" style="padding:24px 12px">
      <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px">
        <tr><td class="mlai-card" style="padding:32px;font-family:Arial,sans-serif;font-size:16px;line-height:1.6;color:#29243a">
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 22px">
            <tr>
              <td valign="middle" style="padding-right:10px"><img src="https://api.mlai.au/static/crm/email/mlai-roo.png" width="34" height="34" alt="" style="display:block;width:34px;height:34px;border:0;border-radius:17px"></td>
              <td valign="middle" style="font-size:21px;line-height:28px;font-weight:700;color:#21182e">MLAI</td>
            </tr>
          </table>
{{ end }}
{{ define "footer" }}
          <p style="margin:24px 0 0;padding-top:16px;border-top:1px solid #e5e7eb;font-size:13px;line-height:1.5;color:#595367">
            MLAI &middot; <a href="mailto:hi@mlai.au" style="color:#4f3a75">hi@mlai.au</a>
          </p>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
{{ end }}
