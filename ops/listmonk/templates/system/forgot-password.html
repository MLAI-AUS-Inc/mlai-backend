{{ define "forgot-password" }}
{{ template "header" . }}
<h2>{{ L.T "email.forgotPassword.subject" }}</h2>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 18px">
  <tr><td bgcolor="#4f3a75" style="border-radius:8px;mso-padding-alt:13px 22px">
    <a href="{{ .ResetURL }}" style="display:inline-block;padding:13px 22px;color:#ffffff;text-decoration:none;font-weight:700">{{ L.T "email.forgotPassword.button" }}</a>
  </td></tr>
</table>
<p style="font-size:13px;color:#595367">{{ L.T "email.forgotPassword.info" }}</p>
{{ template "footer" }}
{{ end }}
