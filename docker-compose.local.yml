services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --worker-class sync --keep-alive ${GUNICORN_KEEP_ALIVE:-2} --timeout ${GUNICORN_TIMEOUT:-30} --graceful-timeout ${GUNICORN_GRACEFUL_TIMEOUT:-30} --max-requests ${GUNICORN_MAX_REQUESTS:-300} --max-requests-jitter ${GUNICORN_MAX_REQUESTS_JITTER:-50} mlai.wsgi:application
    environment:
      APP_ENV: local
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-false}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.local-docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
      local-shared:
        aliases:
          - mlai-backend-web
    restart: unless-stopped

  scheduler:
    build: .
    command: sh -c "until python manage.py migrate --check --noinput; do echo 'Waiting for migrations to complete...'; sleep 5; done; while true; do python manage.py run_scheduled_discovery; sleep 60; done"
    environment:
      APP_ENV: local
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-false}
    volumes:
      - .:/app
    env_file:
      - .env
      - .env.local-docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
      local-shared:
        aliases:
          - mlai-backend-scheduler
    restart: unless-stopped

  bridge-worker:
    build: .
    command: sh -c "until python manage.py migrate --check --noinput; do echo 'Waiting for migrations to complete...'; sleep 5; done; python manage.py run_community_bridge"
    environment:
      APP_ENV: local
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-false}
    volumes:
      - .:/app
    env_file:
      - .env
      - .env.local-docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
      local-shared:
        aliases:
          - mlai-backend-bridge-worker
    restart: unless-stopped

networks:
  local-shared:
    name: mlai-local-shared
    external: true
