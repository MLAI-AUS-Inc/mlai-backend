services:
  web:
    build: .
    command: sh /app/scripts/start-web.sh
    environment:
      APP_ENV: local
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-false}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.local-docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
      local-shared:
        aliases:
          - mlai-backend-web
    restart: unless-stopped

  scheduler:
    build: .
    command: sh -c "until python manage.py migrate --check --noinput; do echo 'Waiting for migrations to complete...'; sleep 5; done; while true; do python manage.py run_scheduled_discovery; sleep 60; done"
    environment:
      APP_ENV: local
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-false}
    volumes:
      - .:/app
    env_file:
      - .env
      - .env.local-docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
      local-shared:
        aliases:
          - mlai-backend-scheduler
    restart: unless-stopped

  bridge-worker:
    build: .
    command: sh -c "until python manage.py migrate --check --noinput; do echo 'Waiting for migrations to complete...'; sleep 5; done; python manage.py run_community_bridge"
    environment:
      APP_ENV: local
      JOBS_SCRAPE_HEADLESS: ${JOBS_SCRAPE_HEADLESS:-false}
    volumes:
      - .:/app
    env_file:
      - .env
      - .env.local-docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
      local-shared:
        aliases:
          - mlai-backend-bridge-worker
    restart: unless-stopped

networks:
  local-shared:
    name: mlai-local-shared
    external: true
