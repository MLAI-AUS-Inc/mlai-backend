services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --threads ${GUNICORN_THREADS:-1} --timeout 300 --max-requests 1000 --max-requests-jitter 50 mlai.wsgi:application"
    environment:
      APP_ENV: local
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.local-docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
      local-shared:
        aliases:
          - mlai-backend-web
    restart: unless-stopped

  scheduler:
    build: .
    command: sh -c "until python manage.py migrate --check --noinput; do echo 'Waiting for migrations to complete...'; sleep 5; done; while true; do python manage.py run_scheduled_discovery; sleep 60; done"
    environment:
      APP_ENV: local
    volumes:
      - .:/app
    env_file:
      - .env
      - .env.local-docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
      local-shared:
        aliases:
          - mlai-backend-scheduler
    restart: unless-stopped

networks:
  local-shared:
    name: mlai-local-shared
    external: true
