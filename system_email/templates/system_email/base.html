<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;">
{% if preheader %}<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>{% endif %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;margin:0;padding:24px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background:#ffffff;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        {% block content %}{% endblock %}
        <tr>
          <td style="padding:0 32px 28px;">
            <p style="margin:0;font-size:12px;line-height:1.5;color:#9ca3af;">{% block footer %}{% endblock %}MLAI · <a href="https://mlai.au" style="color:#9ca3af;">mlai.au</a>{% if unsubscribe_url %} · <a href="{{ unsubscribe_url }}" style="color:#9ca3af;">Unsubscribe</a>{% endif %}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
